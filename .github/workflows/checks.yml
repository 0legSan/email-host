name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - name: Lint and types
        run: |
          for app in api web site; do
            bun run --cwd apps/$app lint
            bun run --cwd apps/$app typecheck
          done
      - name: Installer and image metadata regressions
        run: node --test deploy/public/bootstrap.test.mjs scripts/package-public-images.test.mjs
      - name: Shell syntax
        run: |
          for script in deploy/public/install.sh scripts/build-public-release.sh deploy/public/entrypoints/*; do
            bash -n "$script"
          done
      - name: Build fictional demo
        run: bun run --cwd apps/site build
